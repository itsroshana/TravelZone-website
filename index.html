<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Zone</title>
  <link rel="stylesheet" href="./src/components/style.css">
</head>
<body>

<!-- Navbar -->
<nav id="navbar">
  <h2>TravelZone</h2>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#tours">Tours</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- Hero Section -->
<section class="hero" id="home">
  <video autoplay loop muted>
    <source src="./public/857195-hd_1280_720_25fps.mp4" type="video/mp4">
  </video>
  <div class="hero-content">
    <h1>Explore Luxury Travel</h1>
    <p>Premium Tours & Transportation</p>
    <button>Book Now</button>
  </div>
</section>

<!-- Counter -->
<section class="counter">
  <h2><span id="count">0</span>+ Happy Clients</h2>
</section>

<!-- Tours -->
<section class="tours" id="tours">
  <h2>Popular Tours</h2>
  <div class="tour-container">
    <div class="tour-card">
      <h3>Banff Luxury Tour</h3>
      <p>Premium SUV Experience</p>
    </div>
    <div class="tour-card">
      <h3>Lake Louise Trip</h3>
      <p>Scenic Beauty Adventure</p>
    </div>
    <div class="tour-card">
      <h3>National Park Tour</h3>
      <p>Full Day Guided Tour</p>
    </div>
  </div>
</section>

<!-- Parallax -->
<section class="parallax">
  <h2>Experience The Journey</h2>
</section>

<!-- Contact -->
<section class="contact" id="contact">
  <h2>Contact Us</h2>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <textarea placeholder="Your Message"></textarea>
  <button>Send Message</button>
</section>

<script src="script.js"></script>
</body>
</html>
